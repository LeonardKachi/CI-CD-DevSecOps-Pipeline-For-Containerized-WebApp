# Nginx configuration for the 2048 container.
#
# The container runs as a non-root user with a read-only root filesystem, so:
#   - every path Nginx writes to lives in /tmp (a writable volume in ECS)
#   - logs go to stdout and stderr, where CloudWatch collects them

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temporary files go to /tmp because the rest of the filesystem is read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access logs, so CloudWatch Logs Insights can query fields directly.
    # The load balancer connects to us, so the real visitor IP is in
    # X-Forwarded-For and $remote_addr is the load balancer.
    log_format json escape=json
        '{"time":"$time_iso8601","client":"$http_x_forwarded_for","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # Do not advertise the Nginx version.
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;

    # Must be longer than the load balancer idle timeout (60 s by default).
    # If Nginx closed idle connections first, the load balancer could reuse a
    # dead connection and return 502 errors.
    keepalive_timeout 75s;

    # Slow-client protections. This is a static site: it never needs big
    # requests, long waits, or request bodies.
    client_header_timeout       10s;
    client_body_timeout         10s;
    send_timeout                10s;
    client_max_body_size        1k;
    client_header_buffer_size   1k;
    large_client_header_buffers 2 4k;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml
                      application/vnd.ms-fontobject font/ttf;

    server {
        listen      8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Security headers.
        # "always" adds them to error responses too. They are set only at server
        # level: a child block that defines its own add_header would drop all of
        # these, so the locations below use "expires" instead of add_header.
        #
        # The game has no inline scripts or styles and loads everything from its
        # own origin, so the policy can deny everything else.
        # Strict-Transport-Security is added when HTTPS is added to the load
        # balancer. It is meaningless over plain HTTP.
        add_header X-Content-Type-Options        "nosniff" always;
        add_header X-Frame-Options               "DENY" always;
        add_header Referrer-Policy               "no-referrer" always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy    "same-origin" always;
        add_header Cross-Origin-Resource-Policy  "same-origin" always;
        add_header Content-Security-Policy       "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # A static site only needs GET and HEAD.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Health check for the load balancer, ECS and the Jenkins test stage.
        # Not logged, so checks every few seconds do not flood the logs.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Never serve hidden files such as .git or .env.
        location ~ /\. {
            return 404;
        }

        # The page itself is always revalidated, so a new deployment shows
        # immediately.
        location = /index.html {
            expires -1;
        }

        # Other assets are cached for a short time only. File names are not
        # hashed, so a long cache would hide a new deployment for days.
        location ~* \.(?:css|js|png|ico|woff2?|eot|svg|ttf)$ {
            expires 1h;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
